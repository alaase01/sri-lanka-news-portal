# Production database for RSnewslk.com (see deploy/README.md and the RSnewslk.com hosting guide).
# PostgreSQL listens on the server itself only (127.0.0.1), never on the internet.
# Start:  docker compose -f deploy/docker-compose.db.yml --env-file /srv/rsnewslk/db.env up -d
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: rsnews
      POSTGRES_DB: rsnews
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /srv/rsnewslk/db.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /srv/rsnewslk/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsnews -d rsnews"]
      interval: 10s
      timeout: 5s
      retries: 5
