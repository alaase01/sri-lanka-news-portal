# Local development database only. Not a production configuration.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rsnews
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: rsnews
    ports:
      - "5432:5432"
    volumes:
      - rsnews-db:/var/lib/postgresql/data
volumes:
  rsnews-db:
